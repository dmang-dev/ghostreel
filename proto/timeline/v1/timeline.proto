// The timeline is the one format every ghostreel frontend reads: a replay
// reconstructed into units, per-unit position tracks, periodic snapshots and
// a feed of events. Whichever fidelity tier produced it (tracker samples,
// command estimates, exact engine output), the shape is the same.
//
// Conventions: loops are game loops (22.4 per in-game clock second at Faster);
// coordinates are map cells with the origin at the bottom-left; player 0 is
// neutral. See docs/TIMELINE_FORMAT.md.
syntax = "proto3";

package timeline.v1;

option go_package = "github.com/dmang-dev/ghostreel/gen/timeline/v1;timelinev1";

// Bumped on any incompatible change. Readers refuse versions they don't know.
enum SchemaVersion {
  SCHEMA_VERSION_UNSPECIFIED = 0;
  SCHEMA_VERSION_1 = 1;
}

message Timeline {
  SchemaVersion schema_version = 1;
  Meta meta = 2;
  // Interned unit types; Unit.type and Morph.type index into this list.
  repeated UnitType unit_types = 3;
  // units[i].id == i.
  repeated Unit units = 4;
  // One track per unit that has at least one keyframe, in unit order.
  repeated Track tracks = 5;
  // Every meta.snapshot_interval loops, starting at loop 0.
  repeated Snapshot snapshots = 6;
  // Loop-ordered feed of everything that happened.
  repeated Event events = 7;
  // Player actions counted over the game, for APM. Kept when the command
  // feed is left out; unset when the replay's game events weren't decoded.
  ActionCounts actions = 8;
}

// Which reconstruction produced a keyframe or a whole timeline.
enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_TRACKER = 1; // tracker events: births, deaths, periodic samples
  SOURCE_COMMAND = 2; // estimated from player commands over the pathing grid
  SOURCE_ENGINE = 3;  // exact, from the game engine
}

message Meta {
  string replay_hash = 1; // hex SHA-256 of the replay file
  string version = 2;     // e.g. "5.0.8.86383"
  uint32 base_build = 3;
  // Non-zero when the replay's protocol was unknown and this older build's
  // protocol was used to decode it.
  uint32 protocol_approx_from = 4;
  uint32 loops = 5;
  string map_title = 6;
  string map_hash = 7;      // depot digest; empty for local maps
  string map_file_name = 8; // local map file name; empty for depot maps
  uint32 map_width = 9;
  uint32 map_height = 10;
  repeated Player players = 11;
  Source fidelity = 12; // best source used anywhere in this timeline
  uint32 snapshot_interval = 13;
  string generator = 14; // tool and version that wrote the file
}

message Player {
  uint32 id = 1; // 1-based; 0 is neutral
  string name = 2;
  string race = 3;
  string result = 4;
  uint32 color = 5; // 0xRRGGBB
  float start_x = 6;
  float start_y = 7;
}

enum UnitClass {
  UNIT_CLASS_UNSPECIFIED = 0;
  UNIT_CLASS_ARMY = 1;
  UNIT_CLASS_WORKER = 2;
  UNIT_CLASS_BUILDING = 3;
  UNIT_CLASS_RESOURCE = 4;
  UNIT_CLASS_NEUTRAL = 5;
  UNIT_CLASS_HIDDEN = 6; // UI-only units the game never draws
}

message UnitType {
  string name = 1;
  UnitClass class = 2;
  float radius = 3;
  uint32 footprint_w = 4;
  uint32 footprint_h = 5;
  bool air = 6;
  bool movable = 7; // buildings that can lift off or uproot
  bool known = 8;   // false when sizes are defaults for an unknown type
  float speed = 9;  // cells per game second (Normal speed); 0 = never moves
  float sight = 10; // vision radius in cells (for fog of war)
}

message Unit {
  uint32 id = 1;
  uint32 tag = 2;   // game tag: index << 18 | recycle
  uint32 owner = 3; // owner at birth
  uint32 type = 4;  // type at birth, index into Timeline.unit_types
  uint32 born_loop = 5;
  // Set for units placed as construction sites: the loop construction
  // finished. Unset while still under construction (or for units born done).
  optional uint32 done_loop = 6;
  bool constructed = 7; // placed as a construction site (UnitInit)
  optional uint32 died_loop = 8;
  uint32 killer_player = 9;
  repeated Morph morphs = 10;
  repeated OwnerChange owner_changes = 11;
  // The unit this one came out of (the building that trained it, the egg it
  // hatched from), when the replay says and that unit is in the timeline.
  optional uint32 creator = 12;
}

message Morph {
  uint32 loop = 1;
  uint32 type = 2;
}

message OwnerChange {
  uint32 loop = 1;
  uint32 owner = 2;
}

enum UnitState {
  UNIT_STATE_UNSPECIFIED = 0;
  UNIT_STATE_IDLE = 1;
  UNIT_STATE_MOVING = 2;
  UNIT_STATE_ATTACKING = 3;
  UNIT_STATE_CONSTRUCTING = 4;
  UNIT_STATE_DEAD = 5;
}

message Keyframe {
  uint32 loop = 1;
  float x = 2;
  float y = 3;
  float facing = 4; // radians, counter-clockwise from +x; derived from motion
  UnitState state = 5;
  Source source = 6;
}

message Track {
  uint32 unit_id = 1;
  repeated Keyframe keyframes = 2; // sorted by loop, at most one per loop
}

message Snapshot {
  uint32 loop = 1;
  // Units alive at this loop (born at or before it, not yet dead), sorted.
  repeated uint32 alive = 2;
  // Latest stats per player at or before this loop.
  repeated PlayerStats stats = 3;
}

message Event {
  uint32 loop = 1;
  oneof kind {
    UnitBorn unit_born = 2;
    UnitDied unit_died = 3;
    UnitMorph morph = 4;
    Upgrade upgrade = 5;
    PlayerStats player_stats = 6;
    Chat chat = 7;
    Command command = 8;
    UnitDone unit_done = 9;
  }
}

message UnitBorn {
  uint32 unit_id = 1;
}

message UnitDone {
  uint32 unit_id = 1;
}

message UnitDied {
  uint32 unit_id = 1;
  uint32 killer_player = 2;
}

message UnitMorph {
  uint32 unit_id = 1;
  uint32 type = 2;
}

message Upgrade {
  uint32 player = 1;
  string name = 2;
  int32 count = 3;
}

message PlayerStats {
  uint32 player = 1;
  float supply_used = 2;
  float supply_made = 3;
  uint32 minerals = 4;
  uint32 vespene = 5;
  uint32 mineral_rate = 6; // per in-game minute
  uint32 vespene_rate = 7;
  uint32 workers = 8;
  uint32 army_minerals = 9;
  uint32 army_vespene = 10;
  uint32 lost_minerals = 11;
  uint32 lost_vespene = 12;
  uint32 killed_minerals = 13;
  uint32 killed_vespene = 14;
}

// Actions per player in fixed bins of game loops.
message ActionCounts {
  uint32 bin_loops = 1; // bin width; 112 loops = 5 s on the clock
  repeated PlayerActions players = 2;
}

message PlayerActions {
  uint32 player = 1;
  // actions[i] counts the actions in loops [i * bin_loops, (i + 1) * bin_loops):
  // commands (including retargets), selection changes and control-group
  // updates. Camera moves are not actions.
  repeated uint32 actions = 2;
  // commands[i] counts just the commands among them.
  repeated uint32 commands = 3;
}

message Chat {
  uint32 player = 1;
  string text = 2;
}

message Command {
  uint32 player = 1;
  // Ability link id (build-specific; -1 = smart / right-click).
  int32 ability = 2;
  uint32 ability_cmd_index = 3;
  bool has_target = 4;
  float x = 5;
  float y = 6;
  // Target unit if the command targeted one (0 = none or not resolved).
  uint32 target_unit_id = 7;
  bool has_target_unit = 8;
}
