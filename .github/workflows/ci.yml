# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI builds and tests, and pull requests from forks run here too.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      # Real replays are never committed, so replay-backed tests skip here.
      - run: go test ./...
      # The core must stay cgo-free: it also runs in the browser as WebAssembly.
      - run: CGO_ENABLED=0 GOOS=js GOARCH=wasm go build ./internal/... ./cmd/ghostreel-wasm

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Third-party actions are pinned to a commit, not a movable tag.
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - run: buf lint

  viewer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm run typecheck
        working-directory: viewer
      # Checks the TypeScript model against golden output from the Go code.
      - run: npm test
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      # The browser-only build compiles the Go core too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm run build:web
        working-directory: viewer
