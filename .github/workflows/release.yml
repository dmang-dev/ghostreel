# SPDX-License-Identifier: Apache-2.0
#
# Builds every release artifact when a version tag (v1.2.3) is pushed and
# publishes them as a GitHub release, with latest.json, the signed manifest
# the desktop app updates from (internal/update, cmd/releasetool). A tag
# with a suffix (v1.3.0-rc1) makes a pre-release, which the app doesn't
# offer. Run by hand (workflow_dispatch), it only builds the artifacts.
# Nothing from the game is bundled: models, textures and maps are read from
# each user's own install at run time.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: the build jobs run npm and Go installs. Only the job
# that publishes the release can write.
permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      # `ghostreel serve` finds the viewer in viewer/dist next to itself.
      - name: Build the viewer
        working-directory: viewer
        run: npm ci && npm run build
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=.exe
          out="ghostreel_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "$out/viewer"
          flags="-s -w -X main.version=${GITHUB_REF_NAME}"
          go build -trimpath -ldflags "$flags" -o "$out/ghostreel$ext" ./cmd/ghostreel
          go build -trimpath -ldflags "$flags" -o "$out/ghostreel-engine$ext" ./cmd/ghostreel-engine
          cp -r viewer/dist "$out/viewer/dist"
          cp LICENSE README.md "$out/"
          # The licenses of everything built in (run for this machine, not the target).
          env -u GOOS -u GOARCH -u CGO_ENABLED go run ./cmd/releasetool notices \
            -out "$out/THIRD_PARTY_NOTICES.txt" -go . -npm viewer -third-party third_party
          if [ "$GOOS" = windows ]; then zip -qr "$out.zip" "$out"; else tar czf "$out.tar.gz" "$out"; fi
      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          # The archives only: the staging folder's name has dots too (v1.0.0).
          path: |
            ghostreel_*.zip
            ghostreel_*.tar.gz

  web:
    name: Browser build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build
        working-directory: viewer
        run: npm ci && npm run build:web
      - name: Package
        run: |
          cp LICENSE viewer/dist-web/
          go run ./cmd/releasetool notices -out viewer/dist-web/THIRD_PARTY_NOTICES.txt -go . -npm viewer -third-party third_party
          cd viewer/dist-web && zip -qr "../../ghostreel_${GITHUB_REF_NAME}_web.zip" .
      - uses: actions/upload-artifact@v6
        with:
          name: web
          path: ghostreel_*_web.zip

  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows/amd64 }
          - { os: macos-latest, platform: darwin/universal }
          # webkit2gtk-4.0, which Wails v2 links by default, is in 22.04.
          - { os: ubuntu-22.04, platform: linux/amd64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      # NSIS builds the Windows installer; the runner image doesn't include it.
      - name: Windows installer tools
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      # The installer's version comes from wails.json; keep it in step with the tag.
      - name: Set the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            node -e "const f='desktop/wails.json',j=require('./'+f);j.info.productVersion=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "${BASH_REMATCH[0]}"
          fi
      - name: Build
        working-directory: desktop
        run: |
          extra=""; [ "$RUNNER_OS" = Windows ] && extra="-nsis"
          # The app's version, which the updater compares with the latest release.
          wails build -clean -platform ${{ matrix.platform }} $extra -ldflags "-X main.version=${GITHUB_REF_NAME}"
      - name: Package
        run: |
          # The licenses of everything built in, for every desktop platform.
          go run ./cmd/releasetool notices -out THIRD_PARTY_NOTICES.txt -go . -go desktop -npm viewer -third-party third_party
          base="ghostreel-desktop_${GITHUB_REF_NAME}"
          cd desktop/build/bin || exit 1
          cp ../../../THIRD_PARTY_NOTICES.txt ../../../LICENSE .
          case "$RUNNER_OS" in
            Windows)
              mv ./*installer.exe "../../../${base}_windows_amd64_setup.exe"
              7z a "../../../${base}_windows_amd64_portable.zip" ghostreel-desktop.exe LICENSE THIRD_PARTY_NOTICES.txt ;;
            macOS)
              app=$(ls -d ./*.app | head -1)
              ditto -c -k --keepParent "$app" "../../../${base}_macos_universal.zip"
              zip -j "../../../${base}_macos_universal.zip" LICENSE THIRD_PARTY_NOTICES.txt ;;
            Linux)
              tar czf "../../../${base}_linux_amd64.tar.gz" ghostreel-desktop LICENSE THIRD_PARTY_NOTICES.txt ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ runner.os }}
          path: ghostreel-desktop_*
      # One copy of the notices for the release page, for the installer's
      # users; the other downloads carry their own.
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: notices
          path: THIRD_PARTY_NOTICES.txt

  release:
    needs: [cli, web, desktop]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      # The shell creates SHA256SUMS before find runs, so leave it out.
      - name: Checksums
        run: cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
      # The signed manifest the desktop app updates from. Without the key the
      # release still goes out, but installed apps won't see it.
      - name: Update manifest
        env:
          GHOSTREEL_UPDATE_KEY: ${{ secrets.GHOSTREEL_UPDATE_KEY }}
        run: |
          if [ -z "$GHOSTREEL_UPDATE_KEY" ]; then
            echo "::warning::GHOSTREEL_UPDATE_KEY isn't set: no latest.json, so the desktop app won't offer this release"
            exit 0
          fi
          go run ./cmd/releasetool manifest -tag "$GITHUB_REF_NAME" -dir artifacts \
            -url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            -notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
      # Third-party, with write access: pinned to a commit, not a movable tag.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
